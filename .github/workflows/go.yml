# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Build
      run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -C bootstrapper -o get_artikulo.exe -ldflags="-s -w -H windowsgui -X main.ServerURL=https://artikulo.cz/install -X main.PublicKeyHex=b504b2a00184a0190ecec1ad92aedb077ea3dd8a79da417a767d62d48e8c89a3"

